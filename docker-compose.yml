services:
  db:
    image: postgres:16-alpine
    container_name: news_postgres
    restart: always
    environment:
      POSTGRES_USER: news_admin
      POSTGRES_PASSWORD: news_secure_password
      POSTGRES_DB: news_agency_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: news_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news_backend
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://news_admin:news_secure_password@db:5432/news_agency_db
      - REDIS_URL=redis://redis:6379/0
      - AGENT_MODE=SIMULATION
      - EMERGENCY_STOP=false
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

volumes:
  postgres_data:
